server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true


spring:
  cloud:
    gateway:
      routes:
        - id: summary
          uri: lb://summary
          predicates:
            - Path=/summary/**
        - id: timesheet
          uri: lb://timesheet
          predicates:
            - Path=/timesheet/**
        - id: contact
          uri: lb://profile
          predicates:
            - Path=/profile/**